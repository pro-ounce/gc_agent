; ─────────────────────────────────────────────────────────────────────────────
; /etc/supervisord.conf — main supervisor config for a pip-installed supervisor
; (used when EPEL/dnf supervisor is unavailable — e.g. an unregistered RHEL host).
; Program definitions live in /etc/supervisord.d/*.ini via [include] below.
; ─────────────────────────────────────────────────────────────────────────────
[unix_http_server]
file=/run/supervisor/supervisor.sock
chmod=0700

[supervisord]
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=20MB
logfile_backups=5
loglevel=info
childlogdir=/var/log/supervisor
; started with `-n` (foreground) under systemd; no pidfile needed.

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor/supervisor.sock

[include]
files = /etc/supervisord.d/*.ini
