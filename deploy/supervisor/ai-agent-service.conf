; ─────────────────────────────────────────────────────────────────────────────
; Supervisor program: ai-agent-service (GC Agent — the Python "brain")
;
; RHEL install path:  /etc/supervisord.d/ai-agent-service.ini
;   (the main /etc/supervisord.conf ends with
;    [include] files = /etc/supervisord.d/*.ini  — note the .ini extension)
;
; Layout (matches the /apps/agent pyenv venv build):
;   venv root + app source : /apps/agent   (venv created with `python -m venv /apps/agent`)
;   venv python            : /apps/agent/bin/python
;   config                 : /apps/agent/.env.local
;
; Adjust `user=` to the account that owns /apps/agent, then:
;   supervisorctl reread && supervisorctl update && supervisorctl start ai-agent-service
; ─────────────────────────────────────────────────────────────────────────────
[program:ai-agent-service]

; Launch via the shared deploy runner (same convention as the delivery/rag apps):
; it builds the app once via the factory `app.main:create_app` (APP_SKIP_INIT=1) and
; serves it. Mode is chosen by env below:
;   • TCP  (default here) — AGENT_HOST + AGENT_PORT set. This is what the Spring gateway
;     proxies to (localhost:17024), so KEEP TCP unless the agent moves behind Apache.
;   • UDS  — unset AGENT_HOST/AGENT_PORT and set AGENT_UDS_PATH=/tmp/agent.sock; then point
;     the front proxy (Apache/nginx) at that socket. (delivery/rag run this way.)
command=/apps/agent/bin/python /apps/agent/deploy/run_uvicorn_uds.py

directory=/apps/agent
user=gcusr

; Config is read from /apps/agent/.env.local by the app itself
; (python-dotenv, override=False → these process-env values still win).
; Keep secrets (GC_JWT_SECRET, OPENSEARCH_PASSWORD) in .env.local, mode 0600.
; PYTHONWARNINGS suppresses urllib3's "Unverified HTTPS request" noise at runtime
; when OpenSearch uses a self-signed cert (OPENSEARCH_VERIFY_CERTS=false).
environment=
    ENV="production",
    PYTHONUNBUFFERED="1",
    PYTHONDONTWRITEBYTECODE="1",
    PYTHONWARNINGS="ignore:Unverified HTTPS request",
    AGENT_HOST="0.0.0.0",
    AGENT_PORT="17024",
    AGENT_WORKERS="2"
    ;  ── UDS alternative (delivery/rag-style, behind Apache) ──
    ;  remove AGENT_HOST/AGENT_PORT above and add:
    ;    , AGENT_UDS_PATH="/tmp/agent.sock", AGENT_UDS_MODE="660"

; ── Lifecycle ────────────────────────────────────────────────────────────────
autostart=true
autorestart=true
startsecs=5
startretries=3
; uvicorn master forwards SIGTERM to workers; make sure the whole tree dies.
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true

; ── Logs ─────────────────────────────────────────────────────────────────────
redirect_stderr=false
stdout_logfile=/var/log/gc/ai-agent-service/stdout.log
stderr_logfile=/var/log/gc/ai-agent-service/stderr.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=5
