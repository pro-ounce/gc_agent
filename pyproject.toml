# ── Tool configuration only — no [build-system] block ────────────────────────
# This is a standalone application (not a library).
# Install deps with:  pip install -r requirements.txt
# Run with:          uvicorn app.main:app --host 0.0.0.0 --port 8080

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]
