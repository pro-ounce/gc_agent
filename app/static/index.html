<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCP Agent</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
/* ── Reset & tokens ─────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --sidebar-w: 260px;
  --header-h: 56px;
  --input-h:  72px;

  --bg-app:      #0f1117;
  --bg-sidebar:  #161b27;
  --bg-main:     #1a1f2e;
  --bg-msg-user: #2563eb;
  --bg-msg-bot:  #1e2435;
  --bg-card:     #1e2435;
  --bg-input:    #1e2435;
  --bg-hover:    #252d42;
  --bg-active:   #2d3750;

  --border:      #2a3245;
  --border-focus:#3b82f6;

  --txt-primary:   #e8eaf0;
  --txt-secondary: #7a869a;
  --txt-muted:     #4a5568;
  --txt-user:      #ffffff;
  --txt-link:      #60a5fa;

  --risk-low:    #10b981;
  --risk-medium: #f59e0b;
  --risk-high:   #ef4444;

  --accent:      #3b82f6;
  --accent-dark: #1d4ed8;

  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 18px;

  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'SF Mono', 'Fira Code', Consolas, monospace;
}

html, body { height: 100%; overflow: hidden; font-family: var(--font); background: var(--bg-app); color: var(--txt-primary); }

/* ── Layout ─────────────────────────────────────────────────────────── */
#layout { display: flex; height: 100vh; }

/* ── Sidebar ────────────────────────────────────────────────────────── */
#sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#sidebar-header {
  padding: 16px;
  border-bottom: 1px solid var(--border);
}

#brand {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}

#brand-icon {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, var(--accent), #8b5cf6);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
}

#brand-name { font-weight: 700; font-size: 15px; color: var(--txt-primary); }
#brand-sub  { font-size: 11px; color: var(--txt-secondary); margin-top: 1px; }

#btn-new {
  width: 100%;
  padding: 8px 12px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: background .15s;
}
#btn-new:hover { background: var(--accent-dark); }

#sidebar-body { flex: 1; overflow-y: auto; padding: 8px 0; }

.section-label {
  padding: 6px 16px 4px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--txt-muted);
}

.session-item {
  display: flex;
  align-items: center;
  padding: 8px 12px;
  margin: 1px 8px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  gap: 8px;
  transition: background .12s;
  position: relative;
}
.session-item:hover { background: var(--bg-hover); }
.session-item.active { background: var(--bg-active); }
.session-item .si-icon { font-size: 14px; opacity: .6; flex-shrink: 0; }
.session-item .si-text { flex: 1; min-width: 0; }
.session-item .si-title { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.session-item .si-meta  { font-size: 11px; color: var(--txt-secondary); margin-top: 1px; }
.session-item .si-del {
  display: none;
  background: none; border: none;
  color: var(--txt-secondary); cursor: pointer;
  padding: 2px 4px; border-radius: 4px;
  font-size: 13px;
  flex-shrink: 0;
}
.session-item:hover .si-del { display: block; }
.session-item .si-del:hover { color: var(--risk-high); }

#sidebar-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
}

#health-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--txt-secondary);
  cursor: default;
}
#health-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--txt-muted);
  flex-shrink: 0;
}
#health-dot.up     { background: var(--risk-low); box-shadow: 0 0 6px var(--risk-low); }
#health-dot.down   { background: var(--risk-high); }
#health-dot.degraded { background: var(--risk-medium); }

#mcp-error {
  margin: 8px 0 0;
  padding: 8px 10px;
  background: rgba(239,68,68,.08);
  border: 1px solid rgba(239,68,68,.25);
  border-radius: var(--radius-sm);
  font-size: 11px;
  color: #fca5a5;
  line-height: 1.4;
  display: none;
  word-break: break-all;
}
#mcp-error.visible { display: block; }

/* ── Main ───────────────────────────────────────────────────────────── */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg-main);
}

#chat-header {
  height: var(--header-h);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 12px;
  flex-shrink: 0;
}

#session-title {
  flex: 1;
  font-size: 14px;
  font-weight: 600;
  color: var(--txt-primary);
}

#header-actions { display: flex; gap: 8px; }

.hdr-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--txt-secondary);
  padding: 5px 10px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  cursor: pointer;
  transition: all .15s;
  display: flex; align-items: center; gap: 4px;
}
.hdr-btn:hover { border-color: var(--accent); color: var(--txt-primary); }

/* Tools panel toggle */
#tools-panel {
  width: 280px;
  flex-shrink: 0;
  background: var(--bg-sidebar);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: width .2s;
}
#tools-panel.hidden { width: 0; border-left: none; }
#tools-panel-inner { width: 280px; height: 100%; display: flex; flex-direction: column; overflow: hidden; }

#tools-panel-header {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 13px; font-weight: 600;
  display: flex; align-items: center; justify-content: space-between;
}

#tools-list { flex: 1; overflow-y: auto; padding: 8px; }

.tool-card {
  padding: 10px 12px;
  margin-bottom: 6px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: default;
}
.tool-card-name { font-size: 12px; font-weight: 600; color: var(--txt-primary); margin-bottom: 4px; }
.tool-card-desc { font-size: 11px; color: var(--txt-secondary); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tool-card-footer { margin-top: 6px; display: flex; gap: 4px; }

.badge {
  display: inline-flex; align-items: center;
  padding: 1px 6px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .04em;
}
.badge-low    { background: rgba(16,185,129,.15); color: var(--risk-low); }
.badge-medium { background: rgba(245,158,11,.15); color: var(--risk-medium); }
.badge-high   { background: rgba(239,68,68,.15);  color: var(--risk-high); }
.badge-confirm { background: rgba(99,102,241,.15); color: #818cf8; }

/* ── Messages ───────────────────────────────────────────────────────── */
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

#messages::-webkit-scrollbar { width: 4px; }
#messages::-webkit-scrollbar-track { background: transparent; }
#messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.msg-row {
  display: flex;
  gap: 10px;
  animation: fadeIn .2s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.msg-row.user { flex-direction: row-reverse; }

.msg-avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
  margin-top: 2px;
}
.user .msg-avatar   { background: var(--accent); }
.bot  .msg-avatar   { background: linear-gradient(135deg, #6366f1, #8b5cf6); }

.msg-content { max-width: 72%; display: flex; flex-direction: column; gap: 6px; }
.user .msg-content { align-items: flex-end; }

.msg-bubble {
  padding: 10px 14px;
  border-radius: var(--radius-lg);
  font-size: 14px;
  line-height: 1.6;
  word-break: break-word;
}
.user .msg-bubble {
  background: var(--bg-msg-user);
  color: var(--txt-user);
  border-bottom-right-radius: 4px;
}
.bot .msg-bubble {
  background: var(--bg-msg-bot);
  color: var(--txt-primary);
  border: 1px solid var(--border);
  border-bottom-left-radius: 4px;
}

/* markdown inside bot bubble */
.msg-bubble h1,.msg-bubble h2,.msg-bubble h3 { font-size: 15px; margin: 8px 0 4px; color: var(--txt-primary); }
.msg-bubble p  { margin: 4px 0; }
.msg-bubble ul,.msg-bubble ol { padding-left: 20px; margin: 4px 0; }
.msg-bubble li { margin: 2px 0; }
.msg-bubble code {
  background: rgba(255,255,255,.08);
  padding: 1px 5px; border-radius: 4px;
  font-family: var(--font-mono); font-size: 12px;
}
.msg-bubble pre {
  background: rgba(0,0,0,.3);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 12px;
  overflow-x: auto;
  margin: 8px 0;
}
.msg-bubble pre code { background: none; padding: 0; font-size: 12px; }
.msg-bubble table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 13px; }
.msg-bubble th { background: rgba(255,255,255,.06); text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); }
.msg-bubble td { padding: 5px 10px; border-bottom: 1px solid rgba(255,255,255,.05); }
.msg-bubble a  { color: var(--txt-link); text-decoration: none; }
.msg-bubble a:hover { text-decoration: underline; }
.msg-bubble blockquote { border-left: 3px solid var(--border-focus); padding-left: 10px; color: var(--txt-secondary); margin: 6px 0; }

.msg-meta { font-size: 11px; color: var(--txt-muted); padding: 0 4px; }
.user .msg-meta { text-align: right; }

/* tool-call pills */
.tool-pills { display: flex; flex-wrap: wrap; gap: 4px; }
.tool-pill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px;
  background: rgba(99,102,241,.15);
  border: 1px solid rgba(99,102,241,.3);
  border-radius: 20px;
  font-size: 11px;
  color: #a5b4fc;
}

/* ── Pending action banner ───────────────────────────────────────────── */
#confirm-banner {
  margin: 0 20px;
  padding: 14px 16px;
  background: rgba(245,158,11,.08);
  border: 1px solid rgba(245,158,11,.3);
  border-radius: var(--radius-md);
  display: none;
  flex-direction: column;
  gap: 10px;
  flex-shrink: 0;
}
#confirm-banner.visible { display: flex; }

#confirm-title {
  font-size: 13px; font-weight: 700;
  color: var(--risk-medium);
  display: flex; align-items: center; gap: 6px;
}
#confirm-desc { font-size: 13px; color: var(--txt-primary); }
#confirm-args {
  background: rgba(0,0,0,.3);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 10px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--txt-secondary);
  white-space: pre;
  overflow-x: auto;
  max-height: 120px;
}
#confirm-actions { display: flex; gap: 8px; }

.btn-confirm {
  padding: 7px 16px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: opacity .15s;
}
.btn-confirm:hover { opacity: .85; }
.btn-confirm.yes { background: var(--risk-medium); color: #000; }
.btn-confirm.no  { background: var(--bg-hover); color: var(--txt-secondary); border: 1px solid var(--border); }

/* ── Input area ─────────────────────────────────────────────────────── */
#input-area {
  padding: 12px 20px 16px;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

#input-row {
  display: flex;
  gap: 8px;
  align-items: flex-end;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 8px 12px;
  transition: border-color .15s;
}
#input-row:focus-within { border-color: var(--border-focus); }

#user-input {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  color: var(--txt-primary);
  font-size: 14px;
  font-family: var(--font);
  resize: none;
  max-height: 160px;
  line-height: 1.5;
  padding: 2px 0;
}
#user-input::placeholder { color: var(--txt-muted); }

#btn-send {
  width: 34px; height: 34px;
  flex-shrink: 0;
  background: var(--accent);
  border: none;
  border-radius: 8px;
  color: #fff;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s;
  font-size: 16px;
}
#btn-send:hover:not(:disabled) { background: var(--accent-dark); }
#btn-send:disabled { background: var(--txt-muted); cursor: not-allowed; }

#input-hint {
  font-size: 11px;
  color: var(--txt-muted);
  margin-top: 6px;
  text-align: center;
}

/* ── Loading / typing ───────────────────────────────────────────────── */
.typing-dots { display: flex; gap: 4px; padding: 4px 2px; }
.typing-dots span {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--txt-muted);
  animation: bounce .9s infinite;
}
.typing-dots span:nth-child(2) { animation-delay: .15s; }
.typing-dots span:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 0%,60%,100% { transform: none; } 30% { transform: translateY(-5px); } }

/* ── Empty state ────────────────────────────────────────────────────── */
#empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  color: var(--txt-secondary);
  text-align: center;
  padding: 40px;
}
#empty-state .es-icon { font-size: 48px; opacity: .4; }
#empty-state h2 { font-size: 20px; color: var(--txt-primary); }
#empty-state p  { font-size: 14px; max-width: 340px; line-height: 1.6; }

.suggestion-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 8px;
  max-width: 460px;
}
.suggestion {
  padding: 10px 14px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 12px;
  color: var(--txt-secondary);
  cursor: pointer;
  text-align: left;
  transition: all .15s;
}
.suggestion:hover { border-color: var(--accent); color: var(--txt-primary); background: var(--bg-hover); }

/* ── Scrollbar (Firefox) ────────────────────────────────────────────── */
* { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
</style>
</head>
<body>

<div id="layout">

  <!-- ── Sidebar ── -->
  <aside id="sidebar">
    <div id="sidebar-header">
      <div id="brand">
        <div id="brand-icon">🤖</div>
        <div>
          <div id="brand-name">MCP Agent</div>
          <div id="brand-sub">Enterprise AI Assistant</div>
        </div>
      </div>
      <button id="btn-new" onclick="newSession()">
        <span>＋</span> New Chat
      </button>
    </div>

    <div id="sidebar-body">
      <div class="section-label">Conversations</div>
      <div id="session-list"></div>
    </div>

    <div id="sidebar-footer">
      <div id="health-badge">
        <div id="health-dot"></div>
        <span id="health-text">Connecting…</span>
      </div>
      <div id="mcp-error"></div>
    </div>
  </aside>

  <!-- ── Main ── -->
  <div id="main">
    <div id="chat-header">
      <span id="session-title">New Conversation</span>
      <div id="header-actions">
        <button class="hdr-btn" onclick="toggleTools()" title="Browse tools">
          🔧 <span id="tools-count">Tools</span>
        </button>
        <button class="hdr-btn" onclick="clearChat()" title="Clear messages">
          🗑 Clear
        </button>
      </div>
    </div>

    <!-- Messages -->
    <div id="messages">
      <div id="empty-state">
        <div class="es-icon">💬</div>
        <h2>How can I help?</h2>
        <p>Ask me anything. I have access to enterprise tools and can take actions on your behalf.</p>
        <div class="suggestion-grid" id="suggestions"></div>
      </div>
    </div>

    <!-- Confirmation banner -->
    <div id="confirm-banner">
      <div id="confirm-title">⚠️ Confirm Action</div>
      <div id="confirm-desc"></div>
      <div id="confirm-args"></div>
      <div id="confirm-actions">
        <button class="btn-confirm yes" onclick="confirmAction(true)">✓ Execute</button>
        <button class="btn-confirm no"  onclick="confirmAction(false)">✕ Cancel</button>
      </div>
    </div>

    <!-- Input -->
    <div id="input-area">
      <div id="input-row">
        <textarea
          id="user-input"
          rows="1"
          placeholder="Message MCP Agent…"
          onkeydown="handleKey(event)"
          oninput="autoResize(this)"
        ></textarea>
        <button id="btn-send" onclick="sendMessage()" title="Send (Enter)">➤</button>
      </div>
      <div id="input-hint">Enter to send · Shift+Enter for new line</div>
    </div>
  </div>

  <!-- ── Tools panel ── -->
  <div id="tools-panel" class="hidden">
    <div id="tools-panel-inner">
      <div id="tools-panel-header">
        <span>🔧 Available Tools</span>
        <div style="display:flex;gap:6px">
          <button class="hdr-btn" onclick="loadTools(true)" title="Refresh tools">↺</button>
          <button class="hdr-btn" onclick="toggleTools()">✕</button>
        </div>
      </div>
      <div id="tools-list"><p style="padding:16px;color:var(--txt-muted);font-size:13px">Loading…</p></div>
    </div>
  </div>

</div>

<script>
/* ════════════════════════════════════════════════════════════════════
   State
   ═══════════════════════════════════════════════════════════════════ */
let sessionId   = null;
let sessions    = {};          // id → { title, msgs: [] }
let pendingAction = null;
let isLoading   = false;

const STORAGE_KEY = 'mcp_sessions';

/* ════════════════════════════════════════════════════════════════════
   Init
   ═══════════════════════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', () => {
  loadPersistedSessions();
  checkHealth();
  loadTools();
  setInterval(checkHealth, 30_000);

  // Auto-resize textarea
  const ta = document.getElementById('user-input');
  ta.style.height = 'auto';
});

/* ════════════════════════════════════════════════════════════════════
   Sessions (local state + server sync)
   ═══════════════════════════════════════════════════════════════════ */
function loadPersistedSessions() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    sessions = raw ? JSON.parse(raw) : {};
  } catch { sessions = {}; }
  renderSessions();
}

function persistSessions() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions)); } catch {}
}

function newSession() {
  sessionId = crypto.randomUUID();
  sessions[sessionId] = { title: 'New Conversation', msgs: [] };
  persistSessions();
  renderSessions();
  renderMessages();
  document.getElementById('session-title').textContent = 'New Conversation';
  pendingAction = null;
  hideBanner();
}

function switchSession(id) {
  sessionId = id;
  pendingAction = null;
  hideBanner();
  renderMessages();
  document.getElementById('session-title').textContent = sessions[id]?.title || id;
  renderSessions();
}

async function deleteSession(id, ev) {
  ev.stopPropagation();
  try { await api('DELETE', `/api/sessions/${id}`); } catch {}
  delete sessions[id];
  persistSessions();
  if (sessionId === id) {
    sessionId = null;
    renderMessages();
    document.getElementById('session-title').textContent = 'New Conversation';
  }
  renderSessions();
}

async function clearChat() {
  if (!sessionId) return;
  try { await api('POST', `/api/sessions/${sessionId}/clear`); } catch {}
  if (sessions[sessionId]) sessions[sessionId].msgs = [];
  pendingAction = null;
  hideBanner();
  persistSessions();
  renderMessages();
}

function renderSessions() {
  const el = document.getElementById('session-list');
  const ids = Object.keys(sessions).reverse();
  if (!ids.length) {
    el.innerHTML = '<p style="padding:12px 16px;font-size:12px;color:var(--txt-muted)">No conversations yet</p>';
    return;
  }
  el.innerHTML = ids.map(id => {
    const s = sessions[id];
    const active = id === sessionId ? 'active' : '';
    return `
      <div class="session-item ${active}" onclick="switchSession('${id}')">
        <span class="si-icon">💬</span>
        <div class="si-text">
          <div class="si-title">${esc(s.title)}</div>
          <div class="si-meta">${s.msgs.length} message${s.msgs.length !== 1 ? 's' : ''}</div>
        </div>
        <button class="si-del" onclick="deleteSession('${id}', event)" title="Delete">✕</button>
      </div>`;
  }).join('');
}

/* ════════════════════════════════════════════════════════════════════
   Messages
   ═══════════════════════════════════════════════════════════════════ */
function renderMessages() {
  const el = document.getElementById('messages');
  if (!sessionId || !sessions[sessionId]?.msgs.length) {
    el.innerHTML = `
      <div id="empty-state">
        <div class="es-icon">💬</div>
        <h2>How can I help?</h2>
        <p>Ask me anything. I have access to enterprise tools and can take actions on your behalf.</p>
        <div class="suggestion-grid" id="suggestions"></div>
      </div>`;
    renderSuggestions();
    return;
  }
  el.innerHTML = sessions[sessionId].msgs.map(renderMsg).join('');
  el.scrollTop = el.scrollHeight;
}

function renderMsg(m) {
  const isUser = m.role === 'user';
  const rowCls = isUser ? 'user' : 'bot';
  const avatar = isUser ? '👤' : '🤖';
  const bubble = isUser
    ? `<div class="msg-bubble">${esc(m.content)}</div>`
    : `<div class="msg-bubble">${renderMarkdown(m.content)}</div>`;
  const tools = (m.tool_calls?.length)
    ? `<div class="tool-pills">${m.tool_calls.map(t => `<span class="tool-pill">⚙️ ${esc(t)}</span>`).join('')}</div>`
    : '';
  return `
    <div class="msg-row ${rowCls}">
      <div class="msg-avatar">${avatar}</div>
      <div class="msg-content">
        ${bubble}
        ${tools}
        <div class="msg-meta">${formatTime(m.ts)}</div>
      </div>
    </div>`;
}

function renderMarkdown(text) {
  try { return marked.parse(text || ''); }
  catch { return esc(text); }
}

function addMsg(role, content, toolCalls) {
  if (!sessionId) return;
  const m = { role, content, tool_calls: toolCalls || null, ts: Date.now() };
  sessions[sessionId].msgs.push(m);

  // Update session title from first user message
  if (role === 'user' && sessions[sessionId].msgs.filter(x => x.role === 'user').length === 1) {
    sessions[sessionId].title = content.slice(0, 50) + (content.length > 50 ? '…' : '');
    document.getElementById('session-title').textContent = sessions[sessionId].title;
    renderSessions();
  }

  persistSessions();
  renderMessages();
}

function appendTyping() {
  const el = document.getElementById('messages');
  // Remove empty state if present
  const es = el.querySelector('#empty-state');
  if (es) es.remove();

  const div = document.createElement('div');
  div.id = 'typing-row';
  div.className = 'msg-row bot';
  div.innerHTML = `
    <div class="msg-avatar">🤖</div>
    <div class="msg-content">
      <div class="msg-bubble" style="padding:12px 16px">
        <div class="typing-dots"><span></span><span></span><span></span></div>
      </div>
    </div>`;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

function removeTyping() {
  document.getElementById('typing-row')?.remove();
}

/* ════════════════════════════════════════════════════════════════════
   Suggestions
   ═══════════════════════════════════════════════════════════════════ */
const DEFAULT_SUGGESTIONS = [
  'What tools do you have available?',
  'Show me a list of users',
  'What can you help me with?',
  'Run a health check',
];

async function renderSuggestions() {
  const el = document.getElementById('suggestions');
  if (!el) return;
  let suggestions = DEFAULT_SUGGESTIONS;
  try {
    const data = await api('GET', '/api/tools');
    if (data.tools?.length) {
      suggestions = data.tools.slice(0, 4).map(t =>
        t.description?.split('.')[0]?.replace(/Risk level.*/i, '').trim().slice(0, 60) || t.name
      );
    }
  } catch {}
  el.innerHTML = suggestions.map(s =>
    `<button class="suggestion" onclick="fillSuggestion(this)">${esc(s)}</button>`
  ).join('');
}

function fillSuggestion(btn) {
  const ta = document.getElementById('user-input');
  ta.value = btn.textContent;
  autoResize(ta);
  ta.focus();
}

/* ════════════════════════════════════════════════════════════════════
   Send message
   ═══════════════════════════════════════════════════════════════════ */
async function sendMessage() {
  const ta = document.getElementById('user-input');
  const msg = ta.value.trim();
  if (!msg || isLoading) return;

  // Ensure we have a session
  if (!sessionId) newSession();

  ta.value = '';
  ta.style.height = 'auto';
  setLoading(true);

  addMsg('user', msg);
  appendTyping();

  try {
    const res = await api('POST', '/api/chat', {
      session_id: sessionId,
      message: msg,
      stream: false,
    });

    removeTyping();

    const toolCalls = res.tool_calls_made?.length ? res.tool_calls_made : null;
    addMsg('assistant', res.assistant_message, toolCalls);

    if (res.pending_action) {
      showConfirmBanner(res.pending_action);
    }
  } catch (err) {
    removeTyping();
    addMsg('assistant', `⚠️ Error: ${err.message || 'Request failed'}`);
  } finally {
    setLoading(false);
  }
}

/* ════════════════════════════════════════════════════════════════════
   Confirmation
   ═══════════════════════════════════════════════════════════════════ */
function showConfirmBanner(action) {
  pendingAction = action;
  const riskCls = action.risk_level?.toLowerCase() || 'medium';
  document.getElementById('confirm-title').innerHTML =
    `⚠️ Confirm Action <span class="badge badge-${riskCls}">${action.risk_level}</span>`;
  document.getElementById('confirm-desc').textContent =
    action.description || `Execute tool: ${action.tool_name}`;
  document.getElementById('confirm-args').textContent =
    JSON.stringify(action.tool_args || {}, null, 2);
  document.getElementById('confirm-banner').classList.add('visible');
}

function hideBanner() {
  pendingAction = null;
  document.getElementById('confirm-banner').classList.remove('visible');
}

async function confirmAction(confirmed) {
  if (!pendingAction) return;
  const action = pendingAction;
  hideBanner();
  setLoading(true);
  appendTyping();

  try {
    const res = await api('POST', '/api/chat/confirm', {
      session_id: sessionId,
      action_id: action.id,
      confirmed,
    });
    removeTyping();
    const toolCalls = res.tool_calls_made?.length ? res.tool_calls_made : null;
    addMsg('assistant', res.assistant_message, toolCalls);
    if (res.pending_action) showConfirmBanner(res.pending_action);
  } catch (err) {
    removeTyping();
    addMsg('assistant', `⚠️ Error: ${err.message}`);
  } finally {
    setLoading(false);
  }
}

/* ════════════════════════════════════════════════════════════════════
   Tools panel
   ═══════════════════════════════════════════════════════════════════ */
let toolsPanelOpen = false;

function toggleTools() {
  toolsPanelOpen = !toolsPanelOpen;
  document.getElementById('tools-panel').classList.toggle('hidden', !toolsPanelOpen);
}

async function loadTools(forceRefresh = false) {
  const el = document.getElementById('tools-list');
  el.innerHTML = '<p style="padding:16px;color:var(--txt-muted);font-size:13px">Loading…</p>';
  try {
    const url = forceRefresh ? '/api/tools?refresh=true' : '/api/tools';
    const data = await api('GET', url);
    const tools = data.tools || [];

    document.getElementById('tools-count').textContent = `Tools (${tools.length})`;

    if (!tools.length) {
      const errMsg = data.error
        ? `<p style="font-size:11px;color:#fca5a5;margin-bottom:4px;word-break:break-all">${esc(data.error)}</p>`
        : '';
      const urlMsg = data.mcp_url
        ? `<p style="font-size:11px;color:var(--txt-muted);margin-bottom:12px">${esc(data.mcp_url)}</p>`
        : '';
      el.innerHTML = `
        <div style="padding:16px;text-align:center">
          <div style="font-size:28px;margin-bottom:8px;opacity:.4">🔌</div>
          <p style="font-size:13px;color:var(--txt-secondary);margin-bottom:6px">No tools loaded.</p>
          ${errMsg}${urlMsg}
          <button class="hdr-btn" onclick="loadTools(true)" style="margin:auto">↺ Retry</button>
        </div>`;
      return;
    }

    el.innerHTML = tools.map(t => {
      const risk = (t.risk_level || 'medium').toLowerCase();
      const confirmBadge = t.requires_confirmation
        ? `<span class="badge badge-confirm">Confirm</span>` : '';
      return `
        <div class="tool-card">
          <div class="tool-card-name">${esc(t.name)}</div>
          <div class="tool-card-desc">${esc(cleanDesc(t.description))}</div>
          <div class="tool-card-footer">
            <span class="badge badge-${risk}">${risk}</span>
            ${confirmBadge}
          </div>
        </div>`;
    }).join('');
  } catch (e) {
    document.getElementById('tools-count').textContent = 'Tools';
    el.innerHTML = `
      <div style="padding:16px;text-align:center">
        <div style="font-size:28px;margin-bottom:8px;opacity:.4">⚠️</div>
        <p style="font-size:12px;color:#fca5a5;margin-bottom:12px">${esc(e.message)}</p>
        <button class="hdr-btn" onclick="loadTools(true)" style="margin:auto">↺ Retry</button>
      </div>`;
  }
}

function cleanDesc(desc) {
  return (desc || '').replace(/Risk\s+level[:\s]+\w+\.?/gi, '').replace(/Requires user confirmation[^.]*\./gi, '').trim();
}

/* ════════════════════════════════════════════════════════════════════
   Health
   ═══════════════════════════════════════════════════════════════════ */
async function checkHealth() {
  const dot   = document.getElementById('health-dot');
  const text  = document.getElementById('health-text');
  const errEl = document.getElementById('mcp-error');
  try {
    const data = await api('GET', '/health');
    const st = data.status?.toLowerCase();
    dot.className = '';
    errEl.className = '';
    if (st === 'up' || st === 'healthy') {
      dot.classList.add('up');
      text.textContent = `MCP · ${data.mcp?.tools ?? '?'} tools`;
    } else if (st === 'degraded') {
      dot.classList.add('degraded');
      text.textContent = 'MCP degraded';
      if (data.mcp?.error) {
        errEl.textContent = data.mcp.error;
        errEl.classList.add('visible');
      }
    } else {
      dot.classList.add('down');
      text.textContent = 'MCP offline';
      if (data.mcp?.error) {
        errEl.textContent = data.mcp.error;
        errEl.classList.add('visible');
      }
    }
  } catch (e) {
    dot.className = 'down';
    text.textContent = 'Agent unreachable';
  }
}

/* ════════════════════════════════════════════════════════════════════
   Helpers
   ═══════════════════════════════════════════════════════════════════ */
async function api(method, path, body) {
  const opts = {
    method,
    headers: { 'Content-Type': 'application/json' },
  };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(path, opts);
  if (!res.ok) {
    let detail = res.statusText;
    try { const j = await res.json(); detail = j.detail || detail; } catch {}
    throw new Error(detail);
  }
  return res.json();
}

function setLoading(v) {
  isLoading = v;
  document.getElementById('btn-send').disabled = v;
  document.getElementById('user-input').disabled = v;
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
}

function esc(s) {
  return String(s || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function formatTime(ts) {
  if (!ts) return '';
  return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

// Start with a fresh session
newSession();
</script>
