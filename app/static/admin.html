<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin • GC Agent</title>
  <style>
    /* ── Enterprise admin design system ─────────────────────────────────────
       Sidebar nav + sticky topbar + card content. Light, restrained, dense but
       breathable. Tokens below include every var admin.js's generated content
       relies on (--accent(-wash), --amber(-wash), --good(-wash), --bg, --panel,
       --fg, --ink, --ink-2, --line). */
    :root{
      --bg:#f6f7f9; --panel:#ffffff; --panel-2:#fbfbfd; --sidebar:#141827;
      --ink:#111827; --fg:#111827; --ink-2:#6b7280; --ink-3:#9aa1ad;
      --line:#e7e9ee; --line-2:#eef0f4;
      --accent:#6d28d9; --accent-2:#7c3aed; --accent-wash:#f2edfc; --accent-line:#d9ccf6;
      --good:#16a34a; --good-wash:#e8f6ee; --amber:#b45309; --amber-wash:#fbf1e2;
      --danger:#dc2626; --danger-wash:#fdecec;
      --radius:12px; --radius-sm:9px; --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
      --shadow-md:0 4px 12px rgba(16,24,40,.08);
      --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
      --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Roboto Mono",monospace;
      --sidebar-w:252px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.5;
      font-size:14px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
    .mono,code,kbd{font-family:var(--mono)}
    h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
    a{color:var(--accent)}
    button{font-family:inherit}

    /* App shell */
    .app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;height:100%}

    /* Sidebar */
    .sidebar{background:var(--sidebar);color:#cdd2e0;display:flex;flex-direction:column;min-height:0;
      border-right:1px solid rgba(255,255,255,.06)}
    .brand{display:flex;align-items:center;gap:11px;padding:18px 18px 16px}
    .brand-mark{width:34px;height:34px;border-radius:9px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
      background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;font-size:15px;box-shadow:0 2px 8px rgba(79,70,229,.4)}
    .brand-text{display:flex;flex-direction:column;line-height:1.25}
    .brand-text strong{color:#fff;font-size:14.5px;font-weight:650;letter-spacing:-.01em}
    .brand-text span{font-size:11.5px;color:#8b92a6}
    .side-label{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#6f7691;padding:6px 20px 5px;margin-top:4px}
    .admin-tabs{display:flex;flex-direction:column;gap:1px;padding:4px 10px 12px;overflow-y:auto;flex:1;min-height:0;scrollbar-width:thin}
    .admin-tab{appearance:none;border:0;background:transparent;color:#c2c8d6;text-align:left;cursor:pointer;
      font-size:13.5px;font-weight:500;padding:8px 12px;border-radius:8px;display:flex;align-items:center;gap:9px;
      width:100%;transition:background .12s,color .12s;position:relative;letter-spacing:-.005em}
    .admin-tab::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.32;flex:0 0 auto}
    .admin-tab:hover{background:rgba(255,255,255,.06);color:#fff}
    .admin-tab.active{background:rgba(124,58,237,.22);color:#fff;font-weight:600}
    .admin-tab.active::before{opacity:1;background:#a78bfa;box-shadow:0 0 0 3px rgba(167,139,250,.22)}
    .admin-tab:focus-visible{outline:2px solid #a78bfa;outline-offset:1px}
    .sidebar-foot{padding:12px 18px 16px;font-size:11px;color:#7a8099;border-top:1px solid rgba(255,255,255,.06);line-height:1.45}

    /* Main */
    .main{display:flex;flex-direction:column;min-width:0;min-height:0}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
      padding:14px 26px;background:color-mix(in srgb,var(--panel) 90%,transparent);backdrop-filter:blur(8px);
      border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
    .topbar-title h1{font-size:18px}
    .topbar-title p{margin:1px 0 0;font-size:12.5px;color:var(--ink-2)}
    .topbar-actions{display:flex;align-items:center;gap:10px}
    #status{font-size:12.5px;color:var(--ink-2);min-width:0;font-weight:500}
    #status.ok{color:var(--good)} #status.err{color:var(--danger)} #status.dirty{color:var(--amber)}
    .content{padding:22px 26px 40px;overflow-y:auto;flex:1;min-height:0}

    /* Buttons */
    .btn{appearance:none;cursor:pointer;font-size:13px;font-weight:600;border-radius:var(--radius-sm);
      padding:8px 14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);
      transition:background .12s,border-color .12s,box-shadow .12s,opacity .12s;white-space:nowrap}
    .btn:hover{background:var(--panel-2);border-color:var(--line);box-shadow:var(--shadow)}
    .btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
    .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
    .btn.primary:hover{background:var(--accent-2);box-shadow:0 2px 10px rgba(109,40,217,.28)}
    .btn.primary:disabled{background:#cbb9f0;border-color:#cbb9f0;color:#fff;cursor:default;box-shadow:none}
    .btn.danger{color:var(--danger);border-color:#f0c9c9}
    .btn.danger:hover{background:var(--danger-wash)}
    .btn:disabled{opacity:.55;cursor:default}
    .btns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

    /* Panels / cards */
    .admin-section{display:none}
    .admin-section.active{display:block;animation:fade .18s ease}
    @keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 17px;box-shadow:var(--shadow);min-width:0}
    .card .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
    .card .lbl{font-size:13.5px;font-weight:650;color:var(--ink);letter-spacing:-.005em}
    .card .key{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:.02em;text-transform:none}
    .card .def{font-size:12.5px;color:var(--ink-2);line-height:1.5}
    .card .def code{font-family:var(--mono);font-size:11.5px;background:var(--line-2);padding:1px 5px;border-radius:5px;color:var(--accent)}

    /* Inputs */
    input[type=text],input[type=number],select,textarea{width:100%;font-family:inherit;font-size:13.5px;color:var(--ink);
      background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 11px;transition:border-color .12s,box-shadow .12s}
    input[type=text]:focus,input[type=number]:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
    input.mono,select.mono{font-family:var(--mono);font-size:12.5px}
    input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);cursor:pointer;vertical-align:middle}
    label{font-size:12px;color:var(--ink-2)}
    .state{font-size:12px;font-weight:600;color:var(--ink-2)}
    .default-note,.def-note{font-size:11.5px;color:var(--ink-3);margin-top:6px}

    /* Pills / badges */
    .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;border-radius:999px;
      padding:2px 9px;background:var(--accent-wash);color:var(--accent);border:1px solid var(--accent-line)}
    .badge-dev{font-size:11px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--good-wash);color:var(--good)}
    .badge-dev.cpu{background:var(--amber-wash);color:var(--amber)}
    /* "overridden" marker on a config whose value differs from its .env default */
    .ovr{margin-left:8px;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
      color:var(--amber);background:var(--amber-wash);border:1px solid #f0dcc0;border-radius:999px;padding:1px 7px;vertical-align:middle;white-space:nowrap}

    /* Tables (metrics/backups/audit) */
    table{border-collapse:collapse;width:100%}
    th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);text-align:left;font-weight:600}
    td,th{padding:7px 9px;border-bottom:1px solid var(--line-2)}

    /* Guide tab — the embedded authoring guide fills the content, no new page */
    .guide-wrap{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--panel);box-shadow:var(--shadow)}
    #guide-frame{width:100%;height:calc(100vh - 150px);min-height:540px;border:0;display:block}

    /* Scrollbars */
    .content::-webkit-scrollbar,.admin-tabs::-webkit-scrollbar{width:10px}
    .content::-webkit-scrollbar-thumb{background:#d6d9e0;border-radius:8px;border:3px solid var(--bg)}
    .admin-tabs::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:8px}

    /* Responsive: sidebar collapses to a top nav */
    @media (max-width:880px){
      .app{grid-template-columns:1fr;height:auto;min-height:100%}
      .sidebar{flex-direction:row;align-items:center;overflow-x:auto;border-right:0;border-bottom:1px solid rgba(255,255,255,.08);position:sticky;top:0;z-index:6}
      .brand{padding:12px 14px;flex:0 0 auto}
      .side-label,.sidebar-foot{display:none}
      .admin-tabs{flex-direction:row;padding:8px 10px;gap:4px;overflow-x:auto;overflow-y:hidden}
      .admin-tab{width:auto;white-space:nowrap}
      .admin-tab::before{display:none}
      .topbar{position:static}
      .content{padding:18px 16px 36px}
    }

    /* ── Recovered component library (metrics ticker/switch/gauges, activity, workflow editor, API browser, diagram) ── */
.card .desc{color:var(--ink-2);font-size:12.7px;margin:6px 0 12px}
.ctl input[type=number],.ctl input[type=text],.ctl select{
      width:100%;font:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line);
      border-radius:9px;background:#fff;color:var(--ink)}
.ctl input:focus,.ctl select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;width:0;height:0}
.track{width:44px;height:24px;border-radius:999px;background:#cbd5e1;position:relative;transition:background .15s}
.knob{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;
      box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .15s}
.switch input:checked + .track{background:var(--accent)}
.switch input:checked + .track .knob{left:23px}
.switch input:focus-visible + .track{outline:2px solid var(--accent);outline-offset:2px}
.switch .state{font-size:13px;color:var(--ink-2);min-width:22px}
/* ── Live metrics dashboard ── */
    .ticker-wrap{overflow:hidden;background:#1e1b4b;border:1px solid #2e2a5a;border-radius:10px;margin-bottom:14px}
.ticker-track{display:inline-block;white-space:nowrap;padding:9px 0;font-size:13px;color:#e9e5ff;animation:tick 48s linear infinite;will-change:transform}
.ticker-wrap:hover .ticker-track{animation-play-state:paused}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ticker-track{animation:none}}
.tk{display:inline-flex;align-items:center;gap:6px;margin:0 20px}
.tk b{font-family:"IBM Plex Mono",ui-monospace,monospace;color:#fff}
.badge-dev.gpu{color:var(--good);background:var(--good-wash);border:1px solid #b6e3c4}
.badge-dev.cpu{color:var(--amber);background:var(--amber-wash);border:1px solid #f3ddc0}
.badge-dev.split{color:var(--accent);background:var(--accent-wash);border:1px solid var(--accent-line)}
.badge-dev.ok{color:var(--good);background:var(--good-wash);border:1px solid #b6e3c4}
.badge-dev.warn{color:var(--amber);background:var(--amber-wash);border:1px solid #f3ddc0}
.badge-dev.bad{color:#b91c1c;background:#fdeaea;border:1px solid #f3c9c9}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle;margin-left:3px}
.dot-good{background:var(--good)}
.dot-warn{background:var(--amber)}
.dot-bad{background:#ef4444}
.big{font-size:24px;font-weight:600;font-family:"IBM Plex Mono",ui-monospace,monospace}
.gauge .bar{height:9px;border-radius:999px;background:#eef0f4;overflow:hidden;margin-top:9px}
.gauge .fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#7c3aed,#a855f7);transition:width .5s ease;width:0}
.gauge .fill.warn{background:linear-gradient(90deg,#f59e0b,#f97316)}
.gauge .fill.crit{background:linear-gradient(90deg,#ef4444,#dc2626)}
canvas.chart{width:100%;height:84px;display:block;margin-top:6px}
/* ── Activity feed ── */
    .turn{border-top:1px solid var(--line);padding:10px 2px}
.turn.err{background:#fdeaea77;border-radius:8px;padding:10px 8px}
.turn .q{font-weight:600;font-size:13.5px}
.turn .a{color:var(--ink-2);font-size:13px;margin-top:3px}
.turn .errline{color:#b91c1c;font-size:12px;margin-top:4px;font-family:"IBM Plex Mono",monospace}
.turn .meta{font-size:11.5px;color:var(--ink-2);margin-top:6px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.turn .meta .mono{color:var(--ink)}
/* ── Workflows authoring tab ── */
    .wfe-wrap{display:grid;grid-template-columns:300px 1fr;gap:14px;align-items:start}
@media (max-width:820px){.wfe-wrap{grid-template-columns:1fr}}
.wfe-list-card{max-height:74vh;overflow:auto}
.wfe-item{border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:8px;cursor:pointer;background:var(--panel)}
.wfe-item:hover{border-color:var(--accent-line);background:var(--accent-wash)}
.wfe-item.sel{border-color:var(--accent);background:var(--accent-wash);box-shadow:inset 3px 0 0 var(--accent)}
.wfe-item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wfe-edit-card{min-height:340px;display:flex;flex-direction:column}
.wfe-toggle{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.wfe-vbtn{padding:6px 13px;border:0;background:var(--panel);cursor:pointer;font:inherit;font-size:13px;color:var(--ink-2)}
.wfe-vbtn.active{background:var(--accent-wash);color:var(--accent);font-weight:600}
.wfe-vbtn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.wfe-diagram{margin-top:12px;flex:1;overflow:auto;border:1px solid var(--line);border-radius:11px;background:
      radial-gradient(circle at 1px 1px,#e8eaf0 1px,transparent 0) 0 0/22px 22px,var(--panel);
      min-height:260px;padding:10px;color:var(--ink-2);font-size:13px}
.wfe-diagram svg{display:block;margin:0 auto}
.wfe-json{width:100%;min-height:340px;margin-top:12px;font-size:12.5px;line-height:1.5;padding:12px 13px;
      border:1px solid var(--line);border-radius:11px;background:#0f172a;color:#e2e8f0;resize:vertical;tab-size:2}
.wfe-json:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.wfe-ref{margin-top:10px;font-size:12.5px}
.wfe-ref summary{cursor:pointer;font-weight:600;color:var(--ink-2)}
.wfe-actions{display:flex;align-items:center;gap:9px;margin-top:12px;flex-wrap:wrap}
/* ── API reference tab (swagger-like, grouped by module) ── */
    .btn.api-rw.active{background:var(--accent-wash);border-color:var(--accent-line);color:var(--accent);font-weight:600}
.api-module{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:11px;overflow:hidden}
.api-module[open]{border-color:var(--accent-line)}
.api-mhead{display:flex;align-items:center;gap:11px;flex-wrap:wrap;padding:12px 15px;cursor:pointer;
      list-style:none;user-select:none}
.api-mhead::-webkit-details-marker{display:none}
.api-mhead::before{content:"▸";color:var(--ink-2);font-size:12px;transition:transform .15s}
.api-module[open] .api-mhead::before{transform:rotate(90deg)}
.api-mhead:hover{background:var(--accent-wash)}
.api-mname{font-weight:700;font-size:14.5px}
.api-mmeta{margin-left:auto;font-size:12px;color:var(--ink-2)}
.api-mlist{border-top:1px solid var(--line)}
.api-tool{border-bottom:1px solid var(--line)}
.api-tool:last-child{border-bottom:0}
.api-tool>summary{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:9px 15px 9px 34px;cursor:pointer;
      list-style:none;position:relative}
.api-tool>summary::-webkit-details-marker{display:none}
.api-tool>summary::before{content:"+";position:absolute;left:15px;color:var(--ink-2);font-weight:700}
.api-tool[open]>summary::before{content:"–"}
.api-tool>summary:hover{background:var(--accent-wash)}
.api-tool[open]>summary{background:var(--accent-wash)}
.api-meth{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;font-weight:700;letter-spacing:.03em;
      border-radius:6px;padding:2px 7px;min-width:52px;text-align:center;display:inline-block}
.api-tname{font-size:13px;font-weight:600}
.api-flags{display:inline-flex;gap:5px;flex-wrap:wrap}
.api-desc{flex:1;min-width:120px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.api-tool[open] .api-desc{white-space:normal}
.api-pc{font-size:11px;opacity:.6;white-space:nowrap}
.api-tbody{padding:6px 15px 14px 34px}
table.api-params{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px}
table.api-params th{text-align:left;font-weight:600;color:var(--ink-2);font-size:11px;text-transform:uppercase;
      letter-spacing:.03em;padding:5px 10px;border-bottom:1px solid var(--line)}
table.api-params td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.api-params tr:last-child td{border-bottom:0}
/* ── Health tab (platform liveliness + tiers) ── */
    .dot.dot-good,.dot.dot-warn,.dot.dot-bad{margin-left:0;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 0%,transparent)}
.hz-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:9px 15px;border-bottom:1px solid var(--line)}
.hz-row:last-child{border-bottom:0}
.hz-main{display:flex;align-items:center;gap:9px;min-width:230px;flex:1}
.hz-name{font-weight:600;font-size:13.5px}
.hz-meta{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-2);min-width:120px}
.hz-meta .hz-sep{opacity:.4}
.hz-end{display:flex;align-items:center;gap:10px;margin-left:auto}
.hz-restart{color:#b45309;border-color:#f3ddc0;background:var(--amber-wash)}
.hz-restart:hover:not(:disabled){filter:brightness(.97)}
.hz-restart:disabled{opacity:.55;cursor:default}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">◆</div>
        <div class="brand-text"><strong>GC Agent</strong><span>Admin console</span></div>
      </div>
      <div class="side-label">Sections</div>
      <nav class="admin-tabs" id="tabs" role="tablist" aria-label="Admin sections"></nav>
      <div class="sidebar-foot">Changes persist to OpenSearch and apply on the next turn — no restart.</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-title">
          <h1 id="page-title">Configuration</h1>
          <p>Runtime settings &amp; controls</p>
        </div>
        <div class="topbar-actions">
          <span id="status" class="status" role="status" aria-live="polite"></span>
          <button id="btn-reset" class="btn">Reset to defaults</button>
          <button id="btn-save" class="btn primary" disabled aria-label="Save changes">Save changes</button>
        </div>
      </header>
      <div class="content" id="sections"></div>
    </main>
  </div>

<script src="admin.js"></script>
</body>
</html>
